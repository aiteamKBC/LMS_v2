name: Learner assignment checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/learner_api/reflection_submissions.py'
      - 'frontend/src/api/assignmentTopics.ts'
      - 'frontend/src/api/reflectionSubmission*'
      - 'frontend/src/lib/assignmentTopics.ts'
      - 'frontend/src/pages/learner/video-watch/**'
      - 'frontend/package*.json'
      - 'frontend/eslint.config.ts'
      - '.github/workflows/learner-assignment-checks.yml'
      - '.github/workflows/deploy-aws.yml'
  workflow_call:
    inputs:
      ref:
        description: Commit to verify
        type: string
        required: true

permissions:
  contents: read

env:
  ASSIGNMENT_CHECK_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

jobs:
  frontend:
    name: Assignment frontend types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSIGNMENT_CHECK_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
