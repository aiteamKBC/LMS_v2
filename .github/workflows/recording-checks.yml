name: Recording checks

on:
  pull_request:
    paths:
      - 'backend/coach_api/recordings*.py'
      - 'backend/coach_api/test_recordings*.py'
      - 'backend/coach_api/run_recording_tests.py'
      - 'backend/curriculum_api/**'
      - '.github/workflows/recording-checks.yml'
      - '.github/workflows/deploy-aws.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  recordings:
    name: Tutor and coach recording regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the reviewed backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          load: true
          tags: lms-recordings:ci
          cache-from: type=gha
      - name: Tutor routing, playback and duplicate prevention
        run: docker run --rm --network none -e DJANGO_SECRET_KEY=ci --entrypoint python lms-recordings:ci -m curriculum_api.run_video_import_tests
      - name: Coaching ownership, transcripts and protected playback
        run: docker run --rm --network none -e DJANGO_SECRET_KEY=ci --entrypoint python lms-recordings:ci -m coach_api.run_recording_tests
      - name: Preserve the existing archive contract
        run: docker run --rm --network none -e DJANGO_SECRET_KEY=ci --entrypoint python lms-recordings:ci -m unittest curriculum_api.test_session_cloud_archive_no_db
