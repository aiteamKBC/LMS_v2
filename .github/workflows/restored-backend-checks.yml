name: Restored backend regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/ci/**'
      - '.github/workflows/restored-backend-checks.yml'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read

concurrency:
  group: restored-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Restored backend tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the reviewed backend test image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          load: true
          tags: lms-backend:ci
          cache-from: type=gha
      - name: Existing database-free regressions with external networking disabled
        run: |
          docker run --rm --network none -u 0 -e DJANGO_SECRET_KEY=ci -e DJANGO_DEBUG=false \
            -e SHARD=${{ matrix.shard }} -e SHARDS=4 \
            -e LMS_TEST_FRONTEND_ROOT=/test-frontend \
            -v "$PWD/.github/ci:/ci:ro" -v "$PWD/frontend:/test-frontend:ro" \
            --entrypoint sh lms-backend:ci /ci/no_db_tests.sh
