name: Employer checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/learner_api/employer*.py'
      - 'frontend/src/pages/employer/**'
      - 'frontend/src/api/*employer*.ts'
      - 'frontend/package*.json'
      - '.github/workflows/employer-checks.yml'

permissions:
  contents: read

concurrency:
  group: employer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Employer frontend types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
