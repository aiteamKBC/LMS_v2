name: Employer checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/learner_api/employer*.py'
      - 'backend/learner_api/*employer*test*.py'
      - 'backend/learner_api/test*employer*.py'
      - 'frontend/src/pages/employer/**'
      - 'frontend/src/api/*employer*.ts'
      - 'frontend/src/api/__tests__/*employer*.ts'
      - 'frontend/package*.json'
      - '.github/workflows/employer-checks.yml'

permissions:
  contents: read

concurrency:
  group: employer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Employer frontend contracts and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
        if: ${{ !cancelled() }}
      - name: Employer regression tests (mocked APIs)
        if: ${{ !cancelled() }}
        run: npm test -- src/pages/employer src/api/__tests__/employerPortal.test.ts src/api/employerFeedback.test.ts --maxWorkers=2
      - run: npm run build
        if: ${{ !cancelled() }}

  backend:
    name: Employer backend parity without database or network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Employer and learner parity with forbidden database connections
        working-directory: backend
        run: python -B -m learner_api.run_employer_learning_checks

  teams-backend:
    name: Expanded Teams regressions on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify a fresh cluster and block external service connections
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN=$(dirname "$(find /usr/lib/postgresql -type f -name initdb | sort -V | tail -1)")
          [ -x "$PG_BIN/initdb" ] || { echo 'PostgreSQL initdb is required for isolated regressions'; exit 1; }
          export PG_ROOT
          PG_ROOT=$(mktemp -d "$RUNNER_TEMP/lms-employer-gate.XXXXXX")
          "$PG_BIN/initdb" -D "$PG_ROOT/data" -U lms_gate --auth=trust >/dev/null
          trap '"$PG_BIN/pg_ctl" -D "$PG_ROOT/data" -m immediate -w stop' EXIT
          "$PG_BIN/pg_ctl" -D "$PG_ROOT/data" -l "$PG_ROOT/postgres.log" -o '-h 127.0.0.1 -p 55432' -w start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 55432 -U lms_gate lms_gate_employer_ci
          python -c 'import json,os,pathlib; pathlib.Path(os.environ["PG_ROOT"], "connection.json").write_text(json.dumps(dict(host="127.0.0.1", port=55432, user="lms_gate", dbname="lms_gate_employer_ci")))'
          cd backend
          python -B -m curriculum_api.run_local_teams_tests --connection-file "$PG_ROOT/connection.json" --data-directory "$PG_ROOT/data"
