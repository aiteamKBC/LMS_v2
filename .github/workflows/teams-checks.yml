# ------------------------------------------------------------
# Teams regression checks (AGENTS.md sections 5-7), run by CI instead of
# relying on each agent or developer to remember them.
#
#   pull request into main  -> runs on the PR, so a Teams break shows up
#                              before merging (make "Teams checks / Result"
#                              a required check to block the merge)
#   called by deploy-aws.yml -> the same checks gate the AWS deploy
#
#   frontend baseline   npm run test:teams (mocked APIs, ~15 s). Runs on
#                       every frontend change: that also covers changes to
#                       anything a Teams file imports (the "indirect" rule).
#   expanded backend    NOT run in CI (no test database here). When a file
#                       on .github/ci/teams_files.txt changes, the Result
#                       table says so and lists it as NOT RUN, so the
#                       reviewer knows to run AGENTS.md section 6 by hand.
#   live Teams          never run from CI (needs explicit permission:
#                       AGENTS.md section 3) - always reported as NOT RUN.
#
# The Result job prints the section 7 handoff table: PASS / FAIL / BLOCKED /
# NOT REQUIRED for each check.
# ------------------------------------------------------------
name: Teams checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base:
        description: "Commit to compare with (empty = run everything)"
        type: string
        default: ""
      ref:
        description: "Commit to test"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: teams-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: true

env:
  REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}

jobs:
  scope:
    name: Teams scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - id: scope
        run: |
          set -euo pipefail
          all() { echo "frontend=true" >> "$GITHUB_OUTPUT"; echo "backend=true" >> "$GITHUB_OUTPUT"
                  echo "Running every Teams check: $1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all "no base commit to compare with"; fi
          # A PR is compared with where it branched off, not with newer main
          FROM=$(git merge-base "$BASE" "$REF")
          FILES=$(git diff --name-only "$FROM" "$REF")
          echo "$FILES" | grep -qE '^\.github/(workflows/teams-checks\.yml|ci/teams_files\.txt)$' && all "the Teams checks themselves changed"
          f=false; b=false
          echo "$FILES" | grep -q '^frontend/' && f=true
          TEAMS=$(echo "$FILES" | grep -Ef <(grep -vE '^\s*(#|$)' .github/ci/teams_files.txt) || true)
          [ -n "$TEAMS" ] && b=true && f=true
          echo "frontend=$f" >> "$GITHUB_OUTPUT"; echo "backend=$b" >> "$GITHUB_OUTPUT"
          {
            echo "### Teams scope"
            if [ -n "$TEAMS" ]; then echo "Teams files changed (AGENTS.md section 5):"; echo '```'; echo "$TEAMS"; echo '```'
            else echo "No file on the Teams trigger list changed."; fi
            echo "frontend baseline: $f, expanded backend checks: $b"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Teams frontend baseline
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: npm run test:teams
        run: |
          set -o pipefail
          npm run test:teams 2>&1 | tee teams.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Teams frontend baseline'; echo '```'; grep -E "Test Files|Tests  |FAIL" teams.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The section 7 handoff, and the single check to require on PRs
  result:
    name: Result
    needs: [scope, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          FE: ${{ needs.frontend.result }}
          TEAMS_FILES: ${{ needs.scope.outputs.backend }}
        run: |
          verdict() { case "$1" in success) echo PASS;; skipped) echo "NOT REQUIRED";; failure) [ "$2" = true ] && echo BLOCKED || echo FAIL;; *) echo "BLOCKED ($1)";; esac; }
          fe=$(verdict "$FE")
          if [ "$TEAMS_FILES" = true ]; then be="NOT RUN - no test database in CI; run AGENTS.md section 6 by hand"; else be="NOT REQUIRED"; fi
          {
            echo "### Teams handoff (AGENTS.md section 7)"
            echo "| Check | Result |"; echo "|---|---|"
            echo "| Frontend Teams baseline (mocked APIs) | $fe |"
            echo "| Expanded Teams backend checks | $be |"
            echo "| Live Teams (real meetings/invitations) | NOT RUN - never from CI; needs explicit permission (section 3) |"
            echo
            echo "A pass covers only the automated cases; it does not prove live Microsoft behaviour, permissions or invitations."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SCOPE" = success ] || { echo "::error::Teams scope step did not finish"; exit 1; }
          case "$fe" in *FAIL*|*BLOCKED*) exit 1;; esac
