name: Calendar deployment checks

on:
  pull_request:
    paths:
      - '.github/ci/deploy.sh'
      - '.github/ci/calendar_*.py'
      - '.github/ci/test_calendar_*.py'
      - '.github/workflows/deploy-aws.yml'
      - '.github/workflows/calendar-deployment-checks.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  guards:
    name: Candidate and schema guards (mock AWS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test candidate, migration and rollback ordering without AWS
        run: python3 -m unittest discover -s .github/ci -p 'test_calendar_*.py' -v
      - name: Check deployment shell syntax
        run: bash -n .github/ci/deploy.sh
