<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Kent Business College LMS{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --ink:#1d2433; --muted:#5b6475; --line:#d9dee7; --card:#fff; --bg:#f4f6fa; --brand:#0b3d6e; --danger:#a1271f; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8ecf3; --muted:#a3acbd; --line:#323a4a; --card:#1b2130; --bg:#11151e; --brand:#6aa8e6; --danger:#ef8b82; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  .brand { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--brand); margin:0 0 16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  p, li { color:var(--muted); }
  ul { padding-left:20px; }
  strong { color:var(--ink); }
  .actions { display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  .btn { flex:1; min-width:120px; text-align:center; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .error { color:var(--danger); }
</style>
</head>
<body>
<main>
  <p class="brand">Kent Business College · LMS</p>
  {% block content %}{% endblock %}
</main>
</body>
</html>
